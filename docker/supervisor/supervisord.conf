; ============================================================
; Voltra · ខែលអគ្គីសនី — Supervisor
; ============================================================

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ============================================================
; PHP-FPM
; ============================================================
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=5
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ============================================================
; Nginx
; ============================================================
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=10
stopsignal=QUIT
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ============================================================
; Queue workers
; ============================================================
[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis
    --sleep=3
    --tries=3
    --max-time=3600
    --max-jobs=1000
    --memory=512
    --queue=high,default,low
autostart=true
autorestart=true
startsecs=5
startretries=5
user=www-data
numprocs=%(ENV_QUEUE_WORKERS)s
priority=20
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/queue-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/queue-worker.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5

; ============================================================
; Scheduler
; ============================================================
[program:scheduler]
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction --quiet; sleep 60; done"
autostart=true
autorestart=true
startsecs=5
startretries=5
user=www-data
numprocs=1
priority=30
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/scheduler.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ============================================================
; Event listener
; ============================================================
[eventlistener:process_monitor]
command=/usr/local/bin/supervisor-event-listener.sh
events=PROCESS_STATE,TICK_60
autostart=true
autorestart=true
priority=99
stdout_logfile=/var/log/supervisor/events.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/dev/null

; ============================================================
; Groups
; ============================================================
[group:web]
programs=php-fpm,nginx

[group:workers]
programs=queue-worker,scheduler
