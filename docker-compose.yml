services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: runtime
        image: voltra/app:dev
        container_name: voltra-app
        restart: unless-stopped
        ports:
            - "8080:80"
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            RUN_MIGRATIONS: "false"
            QUEUE_WORKERS: 1
        env_file:
            - .env
        volumes:
            - .:/var/www/html:cached
            - /var/www/html/vendor
            - /var/www/html/node_modules
            - voltra-storage:/var/www/html/storage
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - voltra
        # ---- Resource caps: keep Proxmox VM snappy ----
        deploy:
            resources:
                limits:
                    cpus: "1.5"
                    memory: 1G
                reservations:
                    memory: 256M
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

    redis:
        image: redis:7-alpine
        container_name: voltra-redis
        restart: unless-stopped
        command: >
            redis-server
            --appendonly yes
            --maxmemory 128mb
            --maxmemory-policy allkeys-lru
        volumes:
            - voltra-redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        networks:
            - voltra
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 192M
        logging:
            driver: json-file
            options:
                max-size: "5m"
                max-file: "2"

networks:
    voltra:
        driver: bridge

volumes:
    voltra-redis:
    voltra-storage:
